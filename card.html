<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staci's Business Card Design</title>
    
    <!-- Exact fonts from the website -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Sniglet&family=Titan+One&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        magicalBlue: '#0A1128',
                        magicalPurple: '#3b0764',
                        disneyGold: '#FFD700',
                    },
                    fontFamily: {
                        titan: ['"Titan One"', 'cursive'],
                        sniglet: ['"Sniglet"', 'cursive'],
                        quicksand: ['"Quicksand"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Sized for standard 3.5" x 2" business card at high-res */
        .biz-card {
            width: 1050px;
            height: 600px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .text-outline-dark {
            text-shadow: 3px 3px 0px #0A1128;
        }
    </style>
</head>
<body class="bg-gray-300 flex flex-col items-center gap-10 py-12">

    <!-- FRONT OF CARD -->
    <div class="biz-card bg-gradient-to-br from-magicalBlue via-magicalPurple to-magicalBlue flex flex-col justify-center items-center text-center">
        <!-- Pixie Dust Accents -->
        <div class="absolute top-8 left-8 text-6xl opacity-50">✨</div>
        <div class="absolute bottom-8 right-8 text-6xl opacity-50">✨</div>
        
        <!-- Main Logo -->
        <h1 class="font-titan text-7xl text-disneyGold text-outline-dark tracking-wider mb-2">
            MAGICAL TRAVELS
        </h1>
        <h2 class="font-sniglet text-white text-5xl mt-2">
            with Staci
        </h2>
    </div>

    <!-- BACK OF CARD -->
    <div class="biz-card bg-magicalBlue flex items-center justify-between px-16">
        
        <!-- Left Side: Contact Info -->
        <div class="text-white flex flex-col justify-center">
            <h2 class="font-titan text-6xl text-disneyGold mb-2">Staci</h2>
            <h3 class="font-sniglet text-3xl text-gray-300 mb-12">Personal Trip Designer</h3>
            
            <div class="font-quicksand font-bold text-2xl space-y-6">
                <p class="flex items-center gap-4">
                    <span class="text-4xl">📞</span> (770) 871-6681
                </p>
                <p class="flex items-center gap-4">
                    <span class="text-4xl">✉️</span> Staci.taketimetotravel@gmail.com
                </p>
                <p class="flex items-center gap-4">
                    <span class="text-4xl">📘</span> Facebook: Magical Travels with Staci
                </p>
            </div>
        </div>

        <!-- Right Side: Lead Magnet & QR Code (Horizontal Layout) -->
        <div class="bg-white p-6 rounded-3xl flex items-center gap-6 border-4 border-disneyGold transform rotate-2 max-w-[420px]">
            <div class="text-left">
                <p class="font-titan text-magicalPurple text-3xl leading-tight mb-2">
                    Get your FREE guide here! ✨
                </p>
                <p class="font-quicksand font-bold text-gray-600 text-lg">
                    The Secret Carry-On
                </p>
            </div>
            <!-- Live QR Code generated to point exactly to her URL -->
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://web-gen-lab.github.io/Magical-Travels/" alt="QR Code to Website" class="w-36 h-36 flex-shrink-0 border-2 border-gray-200 rounded-xl p-1">
        </div>
        
    </div>

</body>
</html>
